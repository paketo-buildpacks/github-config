name: Renovate

on:
  workflow_dispatch:
    inputs:
      repository:
        description: 'Repository to run Renovate on (e.g. paketo-buildpacks/jam). Leave empty to run on all repositories.'
        required: false
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: read

jobs:
  renovate:
    runs-on: ubuntu-26.04
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - name: Self-hosted Renovate
      uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
      env:
        RENOVATE_GIT_PRIVATE_KEY: ${{ secrets.PAKETO_BOT_GPG_SIGNING_KEY }}
        RENOVATE_REPOSITORIES: ${{ github.event.inputs.repository }}
      with:
        configurationFile: ./.github/renovate-config.js
        token: ${{ secrets.PAKETO_BOT_GITHUB_TOKEN }}
