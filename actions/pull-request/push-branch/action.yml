name: 'Push branch'

description: |
  Push a git branch to the remote "origin"

inputs:
  branch:
    description: 'Name of the branch to push'
    required: true
  token:
    description: 'GitHub token used to authenticate the push. Must have write access to the repository contents. Deprecated: when omitted, the action falls back to persisted git credentials; this fallback will be removed and the token will become required.'
    required: false
    default: ""
  force:
    description: 'Push using --force-with-lease'
    required: false
    default: ""

runs:
  using: 'docker'
  image: 'Dockerfile'
  args:
  - "--branch"
  - ${{ inputs.branch }}
  - "--token"
  - ${{ inputs.token }}
  - "--force"
  - ${{ inputs.force }}
