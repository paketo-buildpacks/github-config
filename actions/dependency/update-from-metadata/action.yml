name: 'Update buildpack.toml with new dependencies from metadata file'

description: |
  This action updates the buildpack.toml from a metadata JSON file.

inputs:
  buildpack_toml_path:
    description: 'relative or absolute path to buildpack.toml'
    default: 'buildpack.toml'
  metadata_file_path:
    description: 'relative or absolute path to metadata.json'
    default: 'metadata.json'

outputs:
  new-versions:
    description: Newly added dependency versions
    value: ${{ steps.update.outputs.new_versions }}
  semver_bump:
    description: 'The highest semver bump across all updated dependencies'
    value: ${{ steps.semver.outputs.semver_bump }}

runs:
  using: 'composite'
  steps:

  - name: Setup Tools
    uses: paketo-buildpacks/github-config/actions/tools/setup@main

  - name: Back Up buildpack.toml
    shell: bash
    env:
      BUILDPACK_TOML_PATH: ${{ inputs.buildpack_toml_path }}
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      shopt -s inherit_errexit
      cp "${BUILDPACK_TOML_PATH}" "${{ runner.temp }}/buildpack.toml.before"

  - name: Update Dependencies From Metadata
    shell: bash
    id: update
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      shopt -s inherit_errexit
      versions="$(
        jam update-dependencies \
          --buildpack-file "${{ inputs.buildpack_toml_path }}" \
          --metadata-file "${{ inputs.metadata_file_path }}" \
      )"
      versions="$(echo ${versions} | cut -d'[' -f2- | cut -d']' -f-1 | sed 's/ /, /g')"
      echo "new_versions=${versions}" >> "$GITHUB_OUTPUT"
      echo "Added versions ${versions}"

  - name: Calculate Semver Bump
    id: semver
    shell: bash
    env:
      BEFORE_BUILDPACK_TOML_PATH: ${{ runner.temp }}/buildpack.toml.before
      AFTER_BUILDPACK_TOML_PATH: ${{ inputs.buildpack_toml_path }}
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      shopt -s inherit_errexit
      semver_bump="$(libpak-tools ci calculate-semver-bump --before "${BEFORE_BUILDPACK_TOML_PATH}" --after "${AFTER_BUILDPACK_TOML_PATH}")"
      if [[ "${semver_bump}" == "none" ]]; then
        semver_bump=""
      fi
      echo "semver_bump=${semver_bump}" >> "$GITHUB_OUTPUT"
      echo "Semver bump: ${semver_bump:-none}"
