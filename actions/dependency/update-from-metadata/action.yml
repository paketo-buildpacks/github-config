name: 'Update buildpack.toml with new dependencies from metadata file'

description: |
  This action updates the buildpack.toml from a metadata JSON file.

inputs:
  buildpack_toml_path:
    description: 'relative or absolute path to buildpack.toml'
    default: 'buildpack.toml'
  metadata_file_path:
    description: 'relative or absolute path to metadata.json'
    default: 'metadata.json'

outputs:
  new-versions:
    description: Newly added dependency versions
    value: ${{ steps.update.outputs.new_versions }}
  semver_bump:
    description: 'The highest semver bump across all updated dependencies'
    value: ${{ steps.semver.outputs.semver_bump }}

runs:
  using: 'composite'
  steps:

  - name: Choose Jam Version
    id: version
    shell: bash
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      shopt -s inherit_errexit
      version=$(jq -r .jam "scripts/.util/tools.json")
      echo "version=${version#v}" >> "$GITHUB_OUTPUT"

  - name: Install Jam
    shell: bash
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      shopt -s inherit_errexit
      mkdir -p "${HOME}"/bin
      echo "PATH=${HOME}/bin:${PATH}" >> "${GITHUB_ENV}"
      mkdir -p "${HOME}/bin"
      curl "https://github.com/paketo-buildpacks/jam/releases/download/v${{ steps.version.outputs.version }}/jam-linux" \
        --silent \
        --location \
        --output "${HOME}/bin/jam"
      chmod +x "${HOME}/bin/jam"

  - name: Back Up buildpack.toml
    shell: bash
    env:
      BUILDPACK_TOML_PATH: ${{ inputs.buildpack_toml_path }}
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      shopt -s inherit_errexit
      cp "${BUILDPACK_TOML_PATH}" "${{ runner.temp }}/buildpack.toml.before"

  - name: Update Dependencies From Metadata
    shell: bash
    id: update
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      shopt -s inherit_errexit
      versions="$(
        jam update-dependencies \
          --buildpack-file "${{ inputs.buildpack_toml_path }}" \
          --metadata-file "${{ inputs.metadata_file_path }}" \
      )"
      versions="$(echo ${versions} | cut -d'[' -f2- | cut -d']' -f-1 | sed 's/ /, /g')"
      echo "new_versions=${versions}" >> "$GITHUB_OUTPUT"
      echo "Added versions ${versions}"

  # Compare buildpack.toml before and after the update so the pull request can
  # be labeled with the highest semver bump across the updated dependencies.
  - name: Calculate Semver Bump
    id: semver
    shell: bash
    env:
      BEFORE_BUILDPACK_TOML_PATH: ${{ runner.temp }}/buildpack.toml.before
      AFTER_BUILDPACK_TOML_PATH: ${{ inputs.buildpack_toml_path }}
    run: |
      #!/usr/bin/env bash
      set -euo pipefail
      shopt -s inherit_errexit
      semver_bump="$(python3 "${GITHUB_ACTION_PATH}/calculate-semver-bump.py" "${BEFORE_BUILDPACK_TOML_PATH}" "${AFTER_BUILDPACK_TOML_PATH}")"
      echo "semver_bump=${semver_bump}" >> "$GITHUB_OUTPUT"
      echo "Semver bump: ${semver_bump}"
